<!DOCTYPE html>
<html>
<head>
<title>Create Post - UChat</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.header{
background:#1877F2;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
}

textarea{
width:100%;
height:150px;
padding:15px;
font-size:18px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#1877F2;
color:white;
border:none;
border-radius:25px;
font-size:18px;
}
</style>
</head>

<body>

<div class="header">
Create Post
</div>

<div class="card">

<textarea id="post" placeholder="What's on your mind?"></textarea>

<button onclick="savePost()">Post</button>

</div>

<script>
function savePost(){

let text=document.getElementById("post").value;

if(text==""){
alert("Please write something first.");
return;
}

let posts=JSON.parse(localStorage.getItem("posts"))||[];

posts.unshift(text);

localStorage.setItem("posts",JSON.stringify(posts));

alert("Post Created!");

window.location.href="home.html";

}
</script>

</body>
</html>
