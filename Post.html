<!DOCTYPE html>
<html>
<head>
<title>Create Post - UChat</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.header{
background:#1877F2;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
}

textarea{
width:100%;
height:150px;
padding:15px;
font-size:18px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#1877F2;
color:white;
border:none;
border-radius:25px;
font-size:18px;
}
</style>
</head>

<body>

<div class="header">
Create Post
</div>

<div class="card">

<textarea id="post" placeholder="What's on your mind?"></textarea>

<button onclick="savePost()">Post</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8uoqOI9J5XbWKbZpgn4VB-DuNf2b1LJc",
  authDomain: "uchat-b9db2.firebaseapp.com",
  projectId: "uchat-b9db2",
  storageBucket: "uchat-b9db2.firebasestorage.app",
  messagingSenderId: "846402346254",
  appId: "1:846402346254:web:9f45479d5b58764d2ccb5f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.savePost = async function(){

  let text = document.getElementById("post").value;

  if(text == ""){
    alert("Please write something first.");
    return;
  }

  try{
    await addDoc(collection(db,"posts"),{
      text: text,
      user: auth.currentUser ? auth.currentUser.email : "Unknown",
      createdAt: serverTimestamp()
    });

    alert("Post Created!");
    window.location.href="home.html";

  }catch(error){
    alert(error.message);
  }

}
</script>
</body>
</html>
