

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test</title>
</head>
<body>

<input id="email" type="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signUp()">Create</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8uoqOI9J5XbWKbZpgn4VB-DuNf2b1LJc",
  authDomain: "uchat-b9db2.firebaseapp.com",
  projectId: "uchat-b9db2",
  storageBucket: "uchat-b9db2.firebasestorage.app",
  messagingSenderId: "846402346254",
  appId: "1:846402346254:web:a4debd1a3846fb202ccb5f"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.signUp = function() {
  createUserWithEmailAndPassword(
    auth,
    document.getElementById("email").value,
    document.getElementById("password").value
  )
  .then(() => alert("Success"))
  .catch(e => alert(e.code + "\n" + e.message));
}
</script>

</body>
  </html>
